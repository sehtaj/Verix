services:
  - type: web
    name: verix-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    maxShutdownDelaySeconds: 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: VERIX_EXECUTION_BACKEND
        value: e2b
      - key: E2B_TEMPLATE
        value: verix-python-runner
      - key: E2B_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: VERIX_CORS_ORIGINS
        sync: false
      - key: VERIX_MAX_CONCURRENT_JOBS
        value: "1"
      - key: VERIX_REQUESTS_PER_MINUTE
        value: "20"
      - key: VERIX_LLM_CALLS_PER_DAY
        value: "30"
      - key: VERIX_LLM_MAX_OUTPUT_TOKENS
        value: "4096"
      - key: VERIX_MAX_REQUEST_BYTES
        value: "262144"
      - key: VERIX_STALE_WORKSPACE_SECONDS
        value: "3600"
